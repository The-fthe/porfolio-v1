<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ランキのポートフォリオ｜3案のデザイン比較</title>
  <link rel="stylesheet" href="./prototype.css">
  <script src="./prototype.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <div class="prototype-notice"><span>比較用プロトタイプ · 本番未反映</span><button type="button" id="compare-toggle" aria-expanded="false" aria-controls="comparison">3案の違いを見る</button></div>
  <section id="comparison" class="comparison" aria-label="デザインの比較" hidden></section>
  <div id="site"></div>
  <aside class="switcher" aria-label="プロトタイプの切り替え">
    <button type="button" class="cycle" id="previous" aria-label="前の案"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <div class="variant-buttons" role="group" aria-label="デザイン案">
      <button type="button" data-variant="A">A <span>作品展示</span></button>
      <button type="button" data-variant="B">B <span>採用向け</span></button>
      <button type="button" data-variant="C">C <span>制作ノート</span></button>
    </div>
    <button type="button" class="cycle" id="next" aria-label="次の案"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    <button type="button" id="choose" class="choose">この案を選ぶ</button>
    <p id="choice-status" role="status" aria-live="polite"></p>
  </aside>
  <noscript><p>この比較ページはJavaScriptを有効にしてご覧ください。</p></noscript>
</body>
</html>
